<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>节点观察与故障实验</title><link rel="stylesheet" href="style.css"><main style="max-width:1100px;margin:40px auto;padding:20px"><h1>节点观察与故障实验</h1><p>先在预约系统以管理员登录。这里显示节点本地观察值；预约页面使用多数派提交的有序查询。</p><button onclick="refresh()">刷新节点</button> <a href="/">返回预约</a><p>隔离节点 <select id="isolated"><option value="0">n0</option><option value="1">n1</option><option value="2">n2</option></select> <button onclick="isolate()">与其他节点双向隔离</button> <button onclick="heal()">恢复全部链路</button></p><p>业务时钟 <button onclick="clock(-60)">回退一分钟</button> <button onclick="clock(0)">恢复时间</button></p><pre id="error"></pre><section id="nodes"></section><script>
async function post(path,body){const r=await fetch('/api/lab/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const result=await r.json();if(!r.ok)throw Error(result.message||r.status);return result;}
async function isolate(){try{const n=Number(document.getElementById('isolated').value);for(let i=0;i<3;i++)if(i!==n)for(const [source,target] of [[n,i],[i,n]])await post('fault',{source,target,blocked:true});document.getElementById('error').textContent='已隔离 n'+n+'，等待选举稳定后观察结果';await refresh();}catch(e){document.getElementById('error').textContent=e.message;}}
async function heal(){try{for(let source=0;source<3;source++)for(let target=0;target<3;target++)if(source!==target)await post('fault',{source,target,blocked:false});document.getElementById('error').textContent='全部链路已恢复';await refresh();}catch(e){document.getElementById('error').textContent=e.message;}}
async function clock(seconds){try{document.getElementById('error').textContent=JSON.stringify(await post('clock',{seconds}));}catch(e){document.getElementById('error').textContent=e.message;}}
async function refresh(){const r=await fetch('/api/lab/status');const data=await r.json();if(!r.ok){document.getElementById('error').textContent=JSON.stringify(data);return;}document.getElementById('nodes').textContent='';for(const n of data){const pre=document.createElement('pre');pre.style='background:#eee;padding:20px;margin:20px 0;white-space:pre-wrap';pre.textContent=JSON.stringify({node:n.node,leader:n.leader,applied:n.applied,unavailable:n.unavailable,keys:Object.keys(n.values||{}).length,requests:Object.keys(n.requests||{}).length},null,2);document.getElementById('nodes').appendChild(pre);}}
refresh();
</script></main></html>
